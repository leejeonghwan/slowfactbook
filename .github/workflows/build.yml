name: Build & Deploy Slow Factbook

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 20 * * *"        # 매일 05:00 KST 자동 갱신
  workflow_dispatch:

concurrency:
  group: build-deploy            # 푸시가 연달아 와도 한 번에 하나만 돈다 (봇 커밋 충돌 방지)
  cancel-in-progress: true    # 새 푸시가 오면 돌던 빌드는 취소 (최신 커밋이 이긴다)

permissions:
  contents: write         # 자동 갱신분(data/)을 저장소에 되돌려 커밋한다
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: API 차트 최신값 수집
        run: python scripts/build_api_charts.py
      - name: 확정 매칭 차트 제자리 갱신 (KOSIS)
        run: python scripts/refresh_charts.py --apply || echo "갱신 실패 — 기존 데이터로 빌드"
      - name: 갱신분 커밋
        run: |
          git config user.name "slowfactbook-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/overrides.json data/changelog.json data/api.json   # api.json 도 저장소에 남겨 KOSIS 장애 때 직전 성공본으로 버틴다
          if git diff --cached --quiet; then echo "자동 갱신 변경 없음"; else
            git commit -m "자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d')"
            git pull --rebase || true
            git push || echo "커밋 되돌리기 실패 — 사이트는 그대로 빌드"
          fi
      - name: Build site
        run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
