name: Build & Deploy Slow Factbook

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 20 * * *"        # 매일 05:00 KST 자동 갱신
  workflow_dispatch:

permissions:
  contents: write         # 자동 갱신분(data/)을 저장소에 되돌려 커밋한다
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: API 차트 최신값 수집
        run: python scripts/build_api_charts.py
      - name: 확정 매칭 차트 제자리 갱신 (KOSIS)
        run: python scripts/refresh_charts.py --apply || echo "갱신 실패 — 기존 데이터로 빌드"
      - name: 갱신분 커밋
        run: |
          git config user.name "slowfactbook-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/overrides.json data/changelog.json
          if git diff --cached --quiet; then echo "자동 갱신 변경 없음"; else
            git commit -m "자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d')" && git push
          fi
      - name: Build site
        run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
