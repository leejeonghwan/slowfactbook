<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>슬로우팩트북 · 소스 관리대장</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f0;color:#242820;font:15px/1.65 system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:40px 28px}h1{font-size:32px;letter-spacing:-1px;margin:8px 0}p{max-width:1000px;color:#565c52}.eyebrow{color:#47714b;letter-spacing:2px;font-size:12px;font-weight:700}.cards{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}.card{background:white;border:1px solid #d8ddd1;border-radius:10px;padding:16px 22px;min-width:180px}.card b{display:block;font-size:28px}input,select{font:inherit;padding:10px;border:1px solid #bec8b8;border-radius:6px;background:white;max-width:100%}input{width:320px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.scroll{overflow:auto;background:white;border:1px solid #d8ddd1}table{border-collapse:collapse;width:100%;min-width:1040px}th,td{text-align:left;padding:12px;vertical-align:top;border-bottom:1px solid #e7e9e2}th{background:#e8ede2;font-size:13px}td{font-size:13px}td:first-child{width:27%}details{margin-top:8px}summary{cursor:pointer;color:#376345}a{color:#28633f}small{color:#656d60}.warning{padding:14px;background:#fff0d0;border-left:4px solid #bb861d}.badge{display:inline-block;background:#edf0e7;padding:2px 8px;border-radius:4px;white-space:nowrap}.pages{display:flex;align-items:center;gap:16px;margin:15px 0}button{font:inherit;padding:7px 15px;border:1px solid #bec8b8;border-radius:5px;background:white;cursor:pointer}button:disabled{opacity:.4}dt{font-weight:600;margin-top:6px}dd{margin-left:0;overflow-wrap:anywhere}footer{font-size:12px;color:#666;margin-top:24px}
</style>
<main><div class="eyebrow">SLOW FACTBOOK / SOURCE INVENTORY</div><h1>소스부터 정리하는 팩트북</h1>
<p>편집 제목은 그대로 유지합니다. 공식 통계명·시점·계열·단위를 따로 확인하고, 원자료를 확보한 뒤 갱신 주기를 확정합니다. 아래 주기는 1차 제안이며 발표 일정이나 자동 실행을 확정한 값이 아닙니다.</p>
<div id="warning"></div><div class="cards" id="cards"></div>
<div class="filters"><input id="query" placeholder="제목, 출처, 범례, 차트 ID 검색" aria-label="검색"><select id="status" aria-label="소스 상태"></select><select id="cadence" aria-label="확인 주기"></select><select id="quality" aria-label="보완할 항목"><option value="">보완할 항목 전체</option><option value="axis">날짜 축약·빈칸 확인</option><option value="legend">범례 보완 필요</option><option value="identity">차트 ID 확인</option></select></div>
<div id="count"></div><div class="pages"><button id="prev">이전</button><span id="page"></span><button id="next">다음</button></div>
<div class="scroll"><table><thead><tr><th>차트 / 원자료 상세</th><th>소스 상태</th><th>자료 단위 / 확인 주기 제안</th><th>작업 / 담당</th><th>범례·가로축</th></tr></thead><tbody id="rows"></tbody></table></div>
<footer id="footer"></footer></main>
<script type="application/json" id="data">__REPORT__</script>
<script>
const report=JSON.parse(document.getElementById('data').textContent), $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=url=>/^https?:\/\//i.test(url)?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">원자료 열기</a>`:'링크 미확보';
$('warning').innerHTML=report.complete_input?'':`<div class="warning">일부 입력을 읽지 못해 집계가 불완전합니다: ${report.input_errors.map(e=>esc(e.file)).join(', ')}. 해당 파일 정리 후 다시 생성해야 합니다.</div>`;
$('cards').innerHTML=[['점검 차트',report.charts.length],...Object.entries(report.counts.source_status)].map(([name,n])=>`<div class="card"><b>${n.toLocaleString()}</b>${esc(name)}</div>`).join('');
for(const [id,key,label] of [['status','source_status','소스 상태 전체'],['cadence','proposed_check_frequency','확인 주기 전체']]){$(id).innerHTML=`<option value="">${label}</option>`+Object.keys(report.counts[key]).map(v=>`<option>${esc(v)}</option>`).join('');}
let page=0,filtered=[];const size=40;
function filter(){const q=$('query').value.toLowerCase();filtered=report.charts.filter(r=>(!q||[r.title,r.source_text,r.official_table_name,r.chart_id,...r.series_names].join(' ').toLowerCase().includes(q))&&(!$('status').value||r.source_status===$('status').value)&&(!$('cadence').value||r.proposed_check_frequency===$('cadence').value)&&(!$('quality').value||($('quality').value==='axis'?/축약|빈칸|원시점|빈 시점/.test(r.axis_review):$('quality').value==='legend'?r.legend_review==='범례 보완 필요':r.identity_review!=='기존 ID')));page=0;render();}
function render(){const pages=Math.max(1,Math.ceil(filtered.length/size));$('count').textContent=`${filtered.length.toLocaleString()}개 차트 · 소스 링크가 있어도 내용 대조 전에는 검증 완료로 취급하지 않습니다.`;$('page').textContent=`${page+1} / ${pages}`;$('prev').disabled=page===0;$('next').disabled=page+1>=pages;
$('rows').innerHTML=filtered.slice(page*size,(page+1)*size).map(r=>`<tr><td><strong>${esc(r.title)}</strong><br><small>${esc(r.chart_id||'ID 미확인')} · ${esc(r.slide)} · ${esc(r.category)}</small><details><summary>출처와 매칭 단서</summary><dl><dt>기재 출처</dt><dd>${esc(r.source_text||'미기재')}</dd><dt>공식 표명</dt><dd>${esc(r.official_table_name||'미확인')}</dd><dt>연결</dt><dd>${link(r.source_url)} · ${esc(r.connection)}</dd><dt>범례</dt><dd>${esc(r.series_names.join(' / '))}</dd><dt>현재 마지막 라벨</dt><dd>${esc(r.last_label)} (${r.points}개 지점)</dd><dt>발표 주기 / 확정 확인 주기</dt><dd>${esc(r.release_frequency)} / ${esc(r.confirmed_check_frequency)}</dd><dt>원자료 대조</dt><dd>${r.match_verified?'검토 기록 있음':'미완료'} · ${esc(r.identity_review)}</dd><dt>통계 선택 조건</dt><dd>${esc(JSON.stringify(r.series_selector))}</dd><dt>관리 키</dt><dd>${esc(r.audit_key)}</dd><dt>메모</dt><dd>${esc(r.notes||'없음')}</dd></dl></details></td><td><span class="badge">${esc(r.source_status)}</span></td><td>${esc(r.data_frequency)}<br><small>${esc(r.frequency_basis)}</small><br><b>${esc(r.proposed_check_frequency)}</b> <small>제안</small></td><td>${esc(r.update_mode)}<br><small>${esc(r.owner)}</small></td><td>${esc(r.axis_review)}<br>${esc(r.legend_review)}</td></tr>`).join('');}
for(const id of ['query','status','cadence','quality'])$(id).addEventListener('input',filter);
$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};
$('footer').textContent=`생성: ${report.generated_at} · ${report.scope} · 동일 원자료 그룹 ${report.sources.length}개. 외부 전송이나 자동 갱신을 실행하지 않는 로컬 보고서입니다.`;filter();
</script></html>
